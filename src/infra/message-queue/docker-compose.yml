# Kafka & Zookeeper Docker Compose Setup
# 
# Mục đích: Production-ready Kafka cluster với monitoring
# Tại sao Docker: Easy deployment, service isolation, scalability
# Components: Zookeeper, Kafka, Schema Registry, Kafka UI, Log processing

version: '3.8'

services:
  # ======================
  # ZOOKEEPER CLUSTER
  # ======================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    hostname: zookeeper
    container_name: network-monitor-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 5
      ZOOKEEPER_INIT_LIMIT: 10
      ZOOKEEPER_MAX_CLIENT_CNXNS: 0
      ZOOKEEPER_AUTOPURGE_SNAP_RETAIN_COUNT: 3
      ZOOKEEPER_AUTOPURGE_PURGE_INTERVAL: 24
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    networks:
      - kafka-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "echo 'ruok' | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ======================
  # KAFKA BROKER
  # ======================
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    hostname: kafka
    container_name: network-monitor-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      # Basic Configuration
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      
      # Network Configuration
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      
      # Replication & Durability
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      
      # Performance Tuning
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_COMPRESSION_TYPE: 'snappy'
      KAFKA_LOG_CLEANUP_POLICY: 'delete'
      KAFKA_LOG_RETENTION_HOURS: 168  # 7 days
      KAFKA_LOG_RETENTION_BYTES: 1073741824  # 1GB
      KAFKA_LOG_SEGMENT_BYTES: 1073741824  # 1GB
      KAFKA_LOG_ROLL_HOURS: 24
      
      # Memory & Threading
      KAFKA_HEAP_OPTS: "-Xmx1G -Xms1G"
      KAFKA_NUM_NETWORK_THREADS: 8
      KAFKA_NUM_IO_THREADS: 8
      KAFKA_SOCKET_SEND_BUFFER_BYTES: 102400
      KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: 102400
      KAFKA_SOCKET_REQUEST_MAX_BYTES: 104857600
      
      # Consumer Groups
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      
      # JMX Metrics
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: kafka
      
    ports:
      - "9092:9092"
      - "9999:9999"
    volumes:
      - kafka-data:/var/lib/kafka/data
      - kafka-logs:/var/lib/kafka/logs
    networks:
      - kafka-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "unset JMX_PORT; kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ======================
  # SCHEMA REGISTRY (Optional but recommended)
  # ======================
  schema-registry:
    image: confluentinc/cp-schema-registry:7.4.0
    hostname: schema-registry
    container_name: network-monitor-schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'kafka:29092'
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC: _schemas
      SCHEMA_REGISTRY_DEBUG: 'true'
    ports:
      - "8081:8081"
    networks:
      - kafka-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ======================
  # KAFKA UI - Web Interface
  # ======================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: network-monitor-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: network-monitor
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      KAFKA_CLUSTERS_0_READONLY: false
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
      # Authentication (disable for development)
      AUTH_TYPE: "DISABLED"
      MANAGEMENT_HEALTH_LDAP_ENABLED: false
    ports:
      - "8080:8080"
    networks:
      - kafka-network
    restart: unless-stopped

  # ======================
  # KAFKA CONNECT (For external integrations)
  # ======================
  kafka-connect:
    image: confluentinc/cp-kafka-connect:7.4.0
    hostname: kafka-connect
    container_name: network-monitor-kafka-connect
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      CONNECT_BOOTSTRAP_SERVERS: 'kafka:29092'
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: connect-cluster-group
      
      # Converters
      CONNECT_CONFIG_STORAGE_TOPIC: docker-connect-configs
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_FLUSH_INTERVAL_MS: 10000
      CONNECT_OFFSET_STORAGE_TOPIC: docker-connect-offsets
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_TOPIC: docker-connect-status
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      
      # Converters
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_INTERNAL_KEY_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_INTERNAL_VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_INTERNAL_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_INTERNAL_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      
      # Plugins
      CONNECT_PLUGIN_PATH: "/usr/share/java,/usr/share/confluent-hub-components"
      CONNECT_LOG4J_LOGGERS: org.apache.zookeeper=ERROR,org.I0Itec.zkclient=ERROR,org.reflections=ERROR
      
    ports:
      - "8083:8083"
    networks:
      - kafka-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/connectors"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ======================
  # LOG AGGREGATOR - Fluent Bit
  # ======================
  fluent-bit:
    image: fluent/fluent-bit:2.2
    container_name: network-monitor-fluent-bit
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./configs/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./configs/fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - fluent-bit-data:/fluent-bit/data
    environment:
      - FLUENT_BIT_KAFKA_BROKERS=kafka:29092
    networks:
      - kafka-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ======================
  # TOPIC INITIALIZATION
  # ======================
  kafka-init:
    image: confluentinc/cp-kafka:7.4.0
    container_name: network-monitor-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command: |
      bash -c '
        echo "Waiting for Kafka to be ready..."
        sleep 30
        
        echo "Creating topics..."
        
        # Network flow topics
        kafka-topics --create --bootstrap-server kafka:29092 --topic network-flows --partitions 6 --replication-factor 1 --if-not-exists
        kafka-topics --create --bootstrap-server kafka:29092 --topic processed-flows --partitions 6 --replication-factor 1 --if-not-exists
        kafka-topics --create --bootstrap-server kafka:29092 --topic stream-analytics --partitions 3 --replication-factor 1 --if-not-exists
        
        # Detection topics
        kafka-topics --create --bootstrap-server kafka:29092 --topic ddos-alerts --partitions 3 --replication-factor 1 --if-not-exists
        kafka-topics --create --bootstrap-server kafka:29092 --topic web-attack-alerts --partitions 3 --replication-factor 1 --if-not-exists
        kafka-topics --create --bootstrap-server kafka:29092 --topic anomaly-alerts --partitions 3 --replication-factor 1 --if-not-exists
        
        # System topics
        kafka-topics --create --bootstrap-server kafka:29092 --topic application-logs --partitions 3 --replication-factor 1 --if-not-exists
        kafka-topics --create --bootstrap-server kafka:29092 --topic system-metrics --partitions 3 --replication-factor 1 --if-not-exists
        kafka-topics --create --bootstrap-server kafka:29092 --topic security-events --partitions 3 --replication-factor 1 --if-not-exists
        
        # Response topics
        kafka-topics --create --bootstrap-server kafka:29092 --topic mitigation-actions --partitions 3 --replication-factor 1 --if-not-exists
        kafka-topics --create --bootstrap-server kafka:29092 --topic admin-notifications --partitions 1 --replication-factor 1 --if-not-exists
        
        echo "Topics created successfully!"
        
        # List all topics
        echo "Current topics:"
        kafka-topics --list --bootstrap-server kafka:29092
        
        # Configure topic settings for better performance
        echo "Configuring topic settings..."
        kafka-configs --bootstrap-server kafka:29092 --entity-type topics --entity-name network-flows --alter --add-config cleanup.policy=delete,retention.ms=604800000,segment.ms=86400000
        kafka-configs --bootstrap-server kafka:29092 --entity-type topics --entity-name processed-flows --alter --add-config cleanup.policy=delete,retention.ms=259200000,segment.ms=43200000
        
        echo "Kafka initialization completed!"
      '
    networks:
      - kafka-network
    restart: "no"

# ======================
# VOLUMES
# ======================
volumes:
  zookeeper-data:
    driver: local
  zookeeper-logs:
    driver: local
  kafka-data:
    driver: local
  kafka-logs:
    driver: local
  fluent-bit-data:
    driver: local

# ======================
# NETWORKS
# ======================
networks:
  kafka-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16