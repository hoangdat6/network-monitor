
per_flow_rules:
  - id: "PF-001"
    name: "High-Volume UDP Single Flow"
    enabled: true
    severity: "medium"
    description: "Single UDP flow with extremely high packet count (early signal)"
    conditions:
      - field: "protocol"
        operator: "eq"
        value: 17  # UDP
      - field: "tot_fwd_pkts"
        operator: "gt"
        value: 1000
      - field: "flow_duration"
        operator: "lt"
        value: 1000000  # < 1 second
    action: "alert" 


aggregation_rules:
  
  - id: "AGG-001"
    name: "SYN Flood Attack"
    enabled: true
    severity: "critical"
    description: "High SYN count with low ACK ratio - classic SYN flood"
    window: "30s"
    conditions:
      - metric: "syn_flag_count"
        operator: "gt"
        value: 500
      - metric: "syn_ack_ratio"
        operator: "gt"
        value: 0.8
    action: "alert_and_block"
    
  - id: "AGG-002"
    name: "UDP Flood Attack"
    enabled: true
    severity: "critical"
    description: "Massive UDP packet flood"
    window: "60s"
    conditions:
      - metric: "udp_packet_count"
        operator: "gt"
        value: 10000
    action: "alert_and_block"
    
  - id: "AGG-005"
    name: "High Volume from Single IP"
    enabled: true
    severity: "high"
    description: "Excessive traffic from one source"
    window: "60s"
    conditions:
      - metric: "flows_per_ip"
        operator: "gt"
        value: 200
      - metric: "packets_per_ip"
        operator: "gt"
        value: 50000
    action: "alert"

  
  - id: "AGG-006"
    name: "Port Scan Detection"
    enabled: true
    severity: "medium"
    description: "Scanning multiple ports from single IP"
    window: "60s"
    conditions:
      - metric: "unique_dst_ports_per_ip"
        operator: "gt"
        value: 50
      - metric: "flows_per_ip"
        operator: "gt"
        value: 50
    action: "alert"
    
  - id: "AGG-007"
    name: "UDP Port Scan"
    enabled: true
    severity: "medium"
    description: "UDP scanning multiple ports"
    window: "60s"
    conditions:
      - metric: "unique_dst_ports"
        operator: "gt"
        value: 100
      - metric: "udp_packet_count"
        operator: "gt"
        value: 1000
      - metric: "udp_packet_count"
        operator: "lt"
        value: 10000  # Not flood level
    action: "alert"
  
  - id: "AGG-008"
    name: "Low-Rate DDoS / Distributed Attack"
    enabled: true
    severity: "high"
    description: "Many sources with moderate traffic each - distributed DDoS"
    window: "60s"
    conditions:
      - metric: "unique_src_ips"
        operator: "gt"
        value: 50
      - metric: "flows_per_ip"
        operator: "lt"
        value: 50
      - metric: "total_packets"
        operator: "gt"
        value: 20000
    action: "alert"
    
  - id: "AGG-009"
    name: "High-Volume Distributed Attack (Botnet Flood)"
    enabled: true
    severity: "critical"
    description: "Massive traffic from many sources - coordinated botnet attack"
    window: "60s"
    conditions:
      - metric: "unique_src_ips"
        operator: "gt"
        value: 30
      - metric: "total_packets"
        operator: "gt"
        value: 50000
      - metric: "total_flows"
        operator: "gt"
        value: 500
    action: "alert_and_block"
    
config:
  windows:
    short:
      size: 30
      enabled: true
    medium:
      size: 60
      enabled: true
    long:
      size: 300
      enabled: false
  
  alert:
    cooldown: 60
    min_confidence: 0.8
  kafka:
    input_topic: "network-flows"
    output_alert_topic: "ddos-alerts"
    output_ml_topic: "flows-for-ml"
  
  performance:
    batch_size: 100
    flush_interval: 5
