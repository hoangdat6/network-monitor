# DDoS Detection Rules Configuration

# ==============================================================================
# DETECTION THRESHOLDS
# ==============================================================================
# Định nghĩa ngưỡng cảnh báo theo 4 mức độ nghiêm trọng
# 
# Parameters:
#   min_flows: Số lượng flows nghi ngờ tối thiểu
#   min_suspicious_ratio: Tỷ lệ flows nghi ngờ / tổng flows (0.0 - 1.0)
#   min_confidence: Độ tin cậy tối thiểu của ML model (0.0 - 1.0)
#
# Cách điều chỉnh:
# - Tăng min_flows: Giảm false positive, tăng detection time
# - Tăng min_suspicious_ratio: Chỉ alert khi có nhiều flows bất thường
# - Tăng min_confidence: Chỉ alert khi model rất chắc chắn
# ==============================================================================

thresholds:
  low:
    min_flows: 3          # Giảm xuống để dễ test
    min_suspicious_ratio: 0.2  # Giảm xuống 20%
    min_confidence: 0.5   # Giảm xuống 50%
    description: "Suspicious activity detected - monitoring required"
    
  medium:
    min_flows: 50
    min_suspicious_ratio: 0.5
    min_confidence: 0.7
    description: "Potential attack - rate limiting recommended"
    
  high:
    min_flows: 100
    min_suspicious_ratio: 0.7
    min_confidence: 0.8
    description: "Active attack detected - immediate action required"
    
  critical:
    min_flows: 200
    min_suspicious_ratio: 0.8
    min_confidence: 0.9
    description: "Severe attack - emergency countermeasures needed"

# ==============================================================================
# RESPONSE RECOMMENDATIONS
# ==============================================================================
# Khuyến nghị hành động cho từng mức độ nghiêm trọng
# ==============================================================================

recommendations:
  low: "Monitor the situation. Consider rate limiting if it persists."
  medium: "Apply rate limiting. Block suspicious IPs if confirmed."
  high: "Block attacking IPs immediately. Enable DDoS protection."
  critical: "EMERGENCY: Activate all DDoS countermeasures. Contact ISP if needed."

# ==============================================================================
# TIME WINDOWS
# ==============================================================================
# Sliding windows để tổng hợp flows theo thời gian
# 
# Cách hoạt động:
# - Mỗi window track flows trong khoảng thời gian nhất định
# - Flows cũ hơn window_size sẽ bị loại bỏ tự động
# - Có thể sử dụng nhiều windows để phân tích multi-scale
#
# Ví dụ:
#   30s: Phát hiện burst attacks nhanh
#   60s: Phân tích chính (balanced)
#   300s: Phát hiện slow-rate attacks
# ==============================================================================

time_windows:
  short:
    size: 30
    enabled: true
    description: "Fast detection for burst attacks"
    
  medium:
    size: 60
    enabled: true
    primary: true  # Window chính cho alert
    description: "Balanced detection window"
    
  long:
    size: 300
    enabled: true
    description: "Detection for slow-rate attacks"

# ==============================================================================
# ALERT SETTINGS
# ==============================================================================

alert:
  # Thời gian cooldown giữa các alerts cùng loại (seconds)
  # Tránh spam alerts khi attack kéo dài
  cooldown: 60  # Giảm xuống 60s cho testing
  
  # Top N attackers để report trong alert
  top_attackers_count: 5
  
  # Minimum flows trong window để bắt đầu phân tích
  min_flows_for_analysis: 2  # Giảm xuống 2 flows

# ==============================================================================
# FEATURES
# ==============================================================================
# Danh sách 20 features sử dụng cho ML model
# QUAN TRỌNG: Không thay đổi thứ tự nếu đã train model!
# ==============================================================================

features:
  required:
    - Flow Duration
    - Total Fwd Packets
    - Total Backward Packets
    - Total Length of Fwd Packets
    - Total Length of Bwd Packets
    - Fwd Packet Length Max
    - Fwd Packet Length Min
    - Fwd Packet Length Mean
    - Fwd Packet Length Std
    - Bwd Packet Length Max
    - Bwd Packet Length Min
    - Bwd Packet Length Mean
    - Bwd Packet Length Std
    - FIN Flag Count
    - SYN Flag Count
    - RST Flag Count
    - Idle Mean
    - Idle Std
    - Idle Max
    - Idle Min

# ==============================================================================
# IP FILTERING
# ==============================================================================
# Whitelist/Blacklist IPs
# ==============================================================================

ip_filtering:
  # IPs luôn được coi là BENIGN (không alert)
  whitelist:
    - 127.0.0.1
    - 0.0.0.0
    # - 192.168.1.100  # Example: trusted admin IP
  
  # IPs luôn được coi là MALICIOUS (auto alert)
  blacklist: []
    # - 1.2.3.4  # Example: known attacker

# ==============================================================================
# ATTACK TYPES
# ==============================================================================
# Mapping attack types từ model predictions
# ==============================================================================

attack_types:
  BENIGN:
    severity: none
    auto_block: false
    
  DDoS:
    severity: high
    auto_block: true
    description: "Generic DDoS attack"
    
  DoS:
    severity: medium
    auto_block: true
    description: "Denial of Service attack"
    
  # Thêm các loại attack khác nếu model detect được
  # PortScan:
  #   severity: low
  #   auto_block: false

# ==============================================================================
# PERFORMANCE
# ==============================================================================

performance:
  # Số flows giữa các lần analyze window
  analysis_interval: 10
  
  # Batch size cho Kafka consumer
  kafka_batch_size: 100
  
  # Max history size (số alerts lưu trong memory)
  max_alert_history: 1000
