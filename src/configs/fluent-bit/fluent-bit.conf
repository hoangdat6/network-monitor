[SERVICE]
    Parsers_File /fluent-bit/etc/parsers.conf
    Log_Level info
    HTTP_Server On
    HTTP_Listen 0.0.0.0
    HTTP_Port 2020

[INPUT]
    Name  tail
    Path  /var/log/nginx/access.ids.log
    Tag   nginx.access
    Parser json
    Mem_Buf_Limit 50MB
    Skip_Long_Lines On
    Refresh_Interval 5

[FILTER]
    Name   modify
    Match  nginx.access
    Add    source nginx

# ---- OUTPUT to Kafka (bật sẵn) ----
[OUTPUT]
    Name          kafka
    Match         nginx.access
    Brokers       ${KAFKA_BROKERS}
    Topics        ${KAFKA_TOPIC}
    Timestamp_Key ts
    rdkafka.log.connection.close false

# ---- OUTPUT to Redis (List) (bật sẵn) ----
# [OUTPUT]
#     Name     redis
#     Match    nginx.access
#     Host     ${REDIS_HOST}
#     Port     ${REDIS_PORT}
#     Mode     list
#     Key      nginx:logs
#     Command  LPUSH

[OUTPUT]
    Name  stdout
    Match nginx.access