groups:
  - name: smartshield_security_alerts
    rules:
      # DDoS Detection
      - alert: DDoSAttackDetected
        expr: rate(http_requests_total[1m]) > 100
        for: 30s
        labels:
          severity: critical
          attack_type: ddos
        annotations:
          summary: "DDoS attack detected"
          description: "Request rate {{ $value }} req/sec exceeds threshold"

      # High error rate
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 10
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }} errors/sec"

      # Brute force attack
      - alert: BruteForceAttack
        expr: increase(bruteforce_alerts_total[5m]) > 0
        for: 0s
        labels:
          severity: high
          attack_type: bruteforce
        annotations:
          summary: "Brute force attack detected"
          description: "Brute force attack detected on login endpoint"

      # Suspicious input surge
      - alert: SuspiciousInputSurge
        expr: rate(suspicious_inputs_total[1m]) > 5
        for: 30s
        labels:
          severity: warning
          attack_type: injection
        annotations:
          summary: "High suspicious input rate"
          description: "Suspicious input rate: {{ $value }} attempts/sec"

      # High CPU usage
      - alert: HighCPUUsage
        expr: webapp_process_cpu_user_seconds_total > 0.8
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is {{ $value }}"

      # High memory usage
      - alert: HighMemoryUsage
        expr: webapp_process_resident_memory_bytes / (1024*1024*1024) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value }}GB"
