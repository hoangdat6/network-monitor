# DDoS Protection Configuration
# 
# Rate Limiting:
# - Limit request rate per IP
# - Burst handling
# - Connection limiting
#
# Dynamic IP Blocking:
# - Load blocked IPs from map file
# - Auto-reload on change

# Define rate limiting zones
limit_req_zone $binary_remote_addr zone=ddos_global:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=ddos_login:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=ddos_api:10m rate=30r/s;

# Connection limiting
limit_conn_zone $binary_remote_addr zone=ddos_conn:10m;

# Map for blocked IPs (loaded from file)
# File will be managed by Response Manager
geo $blocked_ip {
    default 0;
    include /etc/nginx/blocked_ips.conf;
}

# Timeout settings to prevent slowloris
client_body_timeout 10s;
client_header_timeout 10s;
send_timeout 10s;

# Request limits
client_max_body_size 10m;
client_header_buffer_size 4k;
large_client_header_buffers 4 16k;
