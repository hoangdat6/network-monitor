server {
    listen 80;
    server_name _;

    # Root directory
    root /usr/share/nginx/html;
    index index.html index.htm;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    if ($blocked_ip) {
        return 403;
    }

    # RATE LIMITING (CORE - áp dụng mặc định)
    limit_req zone=ddos_global burst=100 nodelay;
    limit_conn ddos_conn 20;

    # DEFAULT LOCATION
    location / {
        try_files $uri $uri/ =404;
    }

    # STATIC FILES (tùy chỉnh cache nếu cần)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # LOGIN ENDPOINTS (stricter rate limit)
    # Thêm các endpoint login của bạn vào đây
    location ~ ^/(login|signin|auth|authenticate) {
        limit_req zone=ddos_login burst=10 nodelay;
        try_files $uri $uri/ =404;
    }

    # ========================================
    # API ENDPOINTS (medium rate limit)
    # Proxy đến backend API nếu có
    # ========================================
    location /api/ {
        limit_req zone=ddos_api burst=50 nodelay;
        
        # Uncomment nếu proxy đến backend:
        # proxy_pass http://backend:3000;
        # proxy_set_header Host $host;
        # proxy_set_header X-Real-IP $remote_addr;
        # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # proxy_set_header X-Forwarded-Proto $scheme;
        
        try_files $uri $uri/ =404;
    }

    # ========================================
    # ADMIN PANEL (strictest protection)
    # Uncomment và config nếu có admin panel
    # ========================================
    # location /admin/ {
    #     # Chỉ cho phép admin IPs
    #     allow 192.168.1.0/24;
    #     deny all;
    #     
    #     limit_req zone=ddos_login burst=5 nodelay;
    #     
    #     proxy_pass http://backend:3000;
    # }

    # ========================================
    # UPLOAD ENDPOINTS
    # Tùy chỉnh max upload size
    # ========================================
    # location /upload {
    #     client_max_body_size 50m;
    #     proxy_pass http://backend:3000;
    # }

    # ========================================
    # WEBSOCKET (nếu có)
    # ========================================
    # location /ws {
    #     proxy_pass http://backend:3000;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    # }

    # ========================================
    # HEALTH CHECK ENDPOINT
    # ========================================
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ========================================
    # NGINX STATUS FOR PROMETHEUS
    # Internal only - không expose ra ngoài
    # ========================================
    location /nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        allow 172.0.0.0/8;  # Docker networks
        allow 10.0.0.0/8;
        deny all;
    }

    # ========================================
    # DENY ACCESS TO SENSITIVE FILES
    # ========================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# ========================================
# ADDITIONAL SERVERS
# Uncomment và config thêm servers nếu cần
# ========================================

# Internal metrics server for Prometheus
server {
    listen 8081;
    server_name _;
    
    # VTS status endpoint (JSON format for exporter)
    location /status {
        vhost_traffic_status_display;
        vhost_traffic_status_display_format json;
        access_log off;
    }
    
    # Legacy stub_status (backup)
    location /nginx_status {
        stub_status on;
        access_log off;
    }
    
    # Deny all other requests
    location / {
        return 404;
    }
}

