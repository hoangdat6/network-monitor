worker_processes  auto;

# Load VTS module
load_module modules/ngx_http_vhost_traffic_status_module.so;

events { 
    worker_connections  1024; 
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    vhost_traffic_status_zone;
    vhost_traffic_status_filter_by_set_key $status status::*;

    # ========================================
    # LUA ANTI-DDOS CHALLENGE (DISABLED - No Lua Module)
    # Note: Cần build Nginx với ngx_lua module để enable
    # ========================================
    # lua_shared_dict antiddos 10m;
    # access_by_lua_file /etc/nginx/core/anti_ddos_challenge.lua;

    # ========================================
    # DDOS PROTECTION (ENABLED - Rate Limiting Only)
    # ========================================
    include /etc/nginx/core/ddos.conf;
    
    # ========================================
    # MODSECURITY WAF (DISABLED - No ModSecurity Module)
    # Note: Cần cài ModSecurity module để enable
    # ========================================
    # include /etc/nginx/core/modsecurity.conf;

    log_format ids_json escape=json
        '{ "time":"$time_local","ip":"$remote_addr","xff":"$http_x_forwarded_for",'
        '"method":"$request_method","uri":"$request_uri","args":"$args",'
        '"status":$status,"bytes":$body_bytes_sent,"req_len":$request_length,'
        '"req_time":$request_time,"up_time":"$upstream_response_time",'
        '"ua":"$http_user_agent","ref":"$http_referer","proto":"$server_protocol",'
        '"blocked":"$blocked_ip",'
        '"limit_req":"$limit_req_status",'
        '"cache":"$upstream_cache_status" }';

    # Separate log for blocked requests
    map $status $is_blocked {
        default 0;
        403 1;  # Blocked by IP
        429 1;  # Rate limited
    }

    access_log  /var/log/nginx/access.ids.log  ids_json;
    access_log  /var/log/nginx/blocked.log  ids_json if=$is_blocked;
    error_log   /var/log/nginx/error.log warn;

    # ========================================
    # PERFORMANCE SETTINGS
    # ========================================
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # ========================================
    # GZIP COMPRESSION
    # ========================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;


    include /etc/nginx/sites/*.conf;
}


