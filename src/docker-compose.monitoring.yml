# Docker Compose configuration for Monitoring Stack: Prometheus, Node Exporter, and cAdvisor

version: "3.8"

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_HOST_PORT}:${PROMETHEUS_CONTAINER_PORT}"
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./configs/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - ./configs/prometheus/metrics_rules.yml:/etc/prometheus/metrics_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    networks:
      - ids-network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
  
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    ports:
      - "${CADVISOR_HOST_PORT}:${CADVISOR_CONTAINER_PORT}"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    command:
      - "--enable_metrics=cpu,memory,disk,network"
    networks:
      - ids-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT}:${GRAFANA_PORT}"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./configs/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./configs/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./configs/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - ids-network

  telegram-notifier:
    build:
      context: ./infra/telegram-notifier
      dockerfile: Dockerfile
    container_name: telegram-notifier
    restart: unless-stopped
    ports:
      - "${TELEGRAM_NOTIFIER_HOST_PORT}:${TELEGRAM_NOTIFIER_CONTAINER_PORT}"
    environment:
      # Telegram Configuration - REQUIRED
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      # Kafka Configuration
      - KAFKA_BOOTSTRAP_SERVERS=kafka:${KAFKA_PORT}
      - KAFKA_ALERT_TOPIC=ddos-alerts
      # Metrics port
      - METRICS_PORT=${TELEGRAM_NOTIFIER_CONTAINER_PORT}
      # Anti-spam Configuration
      - RATE_LIMIT_WINDOW=300           # Time window in seconds (default: 5 minutes)
      - MAX_ALERTS_PER_WINDOW=5         # Max alerts per window before rate limiting
      - MIN_ALERT_INTERVAL=60           # Minimum seconds between alerts (default: 1 minute)
      - AGGREGATION_WINDOW=180          # Aggregate alerts within this window (default: 3 minutes)
      - COOLDOWN_AFTER_BURST=600        # Cooldown period after rate limit hit (default: 10 minutes)
    networks:
      - ids-network
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:${TELEGRAM_NOTIFIER_CONTAINER_PORT}/metrics', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  prometheus_data:
    name: prometheus_data
  grafana_data:
    name: grafana_data

networks:
  ids-network:
    external: true