# SmartShield WAF Configuration

# Map để định nghĩa bot detection
map $http_user_agent $is_bot {
    default 0;
    ~*bot 1;
    ~*crawler 1;
    ~*spider 1;
    ~*scraper 1;
    "" 1;  # Empty user agent
}

# Map để chặn suspicious requests
map $request_uri $is_suspicious {
    default 0;
    ~*\.\./\.\. 1;  # Path traversal
    ~*eval\( 1;     # Code injection
    ~*union.*select 1; # SQL injection
    ~*<script 1;    # XSS
    ~*javascript: 1; # XSS
}

# Map để phát hiện Tor (placeholder - cần implement với GeoIP)
map $remote_addr $is_tor {
    default 0;
    # Sẽ được update với actual Tor exit nodes
}

server {
    listen 80;
    server_name localhost;

    # Request ID cho tracking
    add_header X-Request-ID $request_id;

    # Anti-DDoS: Connection limiting
    limit_conn addr 10;

    # WAF Rules: Block suspicious requests immediately
    if ($is_suspicious = 1) {
        return 444; # Drop connection
    }

    # Bot protection (basic)
    if ($is_bot = 1) {
        return 403;
    }

    # Chặn certain file types
    location ~* \.(sql|env|config|ini|bak|old|tmp)$ {
        return 404;
    }

    # Security-focused locations
    location = /healthz {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Admin/sensitive paths protection
    location ~* ^/(admin|phpmyadmin|wp-admin) {
        deny all;
        return 404;
    }

    # Login endpoint với rate limiting nghiêm ngặt
    location = /login {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://webapp_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }

    # API endpoints với rate limiting vừa phải
    location /api/ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://webapp_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }

    # Challenge page cho JavaScript verification
    location = /js-challenge {
        return 200 '
            <!DOCTYPE html>
            <html>
            <head>
                <title>Security Check</title>
                <script>
                    // Simple JavaScript challenge
                    function solve() {
                        var result = Math.random().toString(36).substring(2, 15);
                        document.cookie = "challenge=" + result + "; path=/; max-age=3600";
                        window.location.reload();
                    }
                    setTimeout(solve, 2000);
                </script>
            </head>
            <body>
                <h1>Security Check</h1>
                <p>Please wait while we verify your browser...</p>
            </body>
            </html>';
        add_header Content-Type text/html;
    }

    # Default location với rate limiting
    location / {
        limit_req zone=general burst=20 nodelay;
        
        # JavaScript challenge check (basic implementation)
        if ($cookie_challenge = "") {
            # Redirect to challenge for first-time visitors
            # return 302 /js-challenge;
        }

        proxy_pass http://webapp_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # Buffer tuning
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Error pages
    error_page 429 /429.html;
    location = /429.html {
        root /usr/share/nginx/html;
        internal;
    }

    error_page 403 /403.html;
    location = /403.html {
        root /usr/share/nginx/html;
        internal;
    }
}
